<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إناس الحاج حامد | اتصل بي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">إناس الحاج حامد</a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="experiences.html">خبراتي</a></li>
                <li><a href="contact.html" class="active">اتصل بي</a></li>
            </ul>
            <div class="nav-actions">
                <button id="langBtn" aria-label="تبديل اللغة">EN</button>
                <button id="themeBtn" aria-label="تبديل النمط">🌙</button>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="page-title">تواصل معي</h1>
        
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">الاسم الكامل *</label>
                <input type="text" id="name" placeholder="اكتب اسمك الكامل هنا">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني *</label>
                <input type="email" id="email" placeholder="name@example.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="subject">الموضوع</label>
                <input type="text" id="subject" placeholder="عنوان الرسالة (اختياري)">
            </div>

            <div class="form-group">
                <label for="message">الرسالة *</label>
                <textarea id="message" rows="5" placeholder="اكتب تفاصيل رسالتك هنا..."></textarea>
                <small class="error" id="messageError"></small>
            </div>

            <button type="submit" class="btn">إرسال الرسالة</button>
        </form>

        <div id="thankYou" class="thank-you hidden">
            <h2>شكراً لك! 💙</h2>
            <p>تم استلام رسالتك بنجاح. شكراً لتواصلك مع إناس الحاج حامد، سيتم الرد عليك في أقرب وقت ممكن.</p>
        </div>
    </main>

    <footer>
        <p>© 2026 إناس الحاج حامد - جميع الحقوق محفوظة</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
